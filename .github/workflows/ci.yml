name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agents/**'
      - 'skills/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'agents/**'
      - 'skills/**'

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest + coverage)
        run: uv run python -m pytest tests/ -q --cov=brightsmith --cov-report=term-missing

      - name: Warehouse paths relocatable (guards committed example warehouses)
        run: uv run python -m brightsmith.infra.relocate --check
