[project]
name = "brightsmith"
version = "0.4.0"
description = "AI agent data pipeline framework — Bronze to MCP with full governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastavro>=1.9",
    "httpx>=0.27",
    "mcp>=1.0",
    "pyarrow>=17.0",
    "pyiceberg[sql-sqlite]>=0.7",
    # Runtime dependency of DuckDB's Arrow/timestamp bridge (imported lazily by
    # the duckdb C-extension, not declared in its metadata — so it must be pinned
    # explicitly here or read_with_duckdb fails with ModuleNotFoundError: pytz).
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightsmith"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1.390",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = [
    "E501",    # line-too-long: advisory only until an autoformatter (ruff format) is adopted
    "SIM105",  # contextlib.suppress over try/except/pass: keep handlers explicit (no-swallow doctrine)
    "SIM108",  # ternary over if/else: several proposed ternaries are less readable than the block
    "SIM117",  # combined with-statements: nested `with` is sometimes clearer; not worth churn
    "UP042",   # str+Enum -> StrEnum: changes __str__ semantics (serialization risk); defer deliberately
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that require network access (deselected by default)",
]
addopts = "-m 'not network'"
